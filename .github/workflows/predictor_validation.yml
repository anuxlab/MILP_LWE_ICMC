name: Predictor Validation (Extension 6)

on:
  push:
    branches: [main]
    paths:
      - 'build_predictor_features.py'
      - 'train_and_validate_predictor.py'
      - 'plot_predictor_validation.py'
      - '.github/workflows/predictor_validation.yml'
  workflow_dispatch:

jobs:
  validate:
    name: Build features, train, validate
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install scikit-learn>=1.3

      - name: Restore benchmark_results.json from artifacts
        uses: actions/download-artifact@v4
        with:
          name: benchmark-results-merged
          path: results/
        continue-on-error: true

      - name: Build predictor features
        run: python build_predictor_features.py

      - name: Train and validate predictors
        run: python train_and_validate_predictor.py

      - name: Plot validation results
        run: python plot_predictor_validation.py

      - name: Upload validation artifacts
        uses: actions/upload-artifact@v4
        with:
          name: predictor-validation
          path: |
            results/predictor_features.json
            results/predictor_validation.json
            results/fig_predictor_validation.pdf
            results/fig_predictor_validation.png
          retention-days: 90