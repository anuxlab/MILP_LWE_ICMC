  benchmark:
    name: Benchmark n=${{ matrix.dimension }}
    needs: quick-test
    runs-on: ubuntu-latest
    timeout-minutes: 200
    continue-on-error: true

    strategy:
      fail-fast: false           # keep running even if one dimension fails
      max-parallel: 6            # cap concurrency to stay within free tier
      matrix:
        dimension: [5, 10, 15, 20, 25, 30, 35, 40, 45, 50]  # <-- only NEW dims here; n=5,10,15 are cached

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # ---- Restore SHARED checkpoints (read-only; safe across parallel jobs) ----
      - name: Restore shared checkpoint cache
        uses: actions/cache/restore@v4
        with:
          path: results/checkpoints
          key: lwe-checkpoints-schema6-common-${{ github.run_id }}
          restore-keys: |
            lwe-checkpoints-schema6-common-
            lwe-checkpoints-schema5-main-

      # ---- Run ONLY this dimension ----
      - name: Run benchmark for n=${{ matrix.dimension }}
        run: |
          mkdir -p results
          python lwe_benchmark.py \
            --dimensions ${{ matrix.dimension }} \
            --instances 10 \
            --time-limit 60 \
            --bkz-beta 15 \
            2>&1 | tee results/run_dim${{ matrix.dimension }}.log

      # ---- Save per-dimension checkpoints (unique key; no race) ----
      - name: Save per-dimension checkpoints
        if: always()
        uses: actions/cache/save@v4
        with:
          path: results/checkpoints
          key: lwe-checkpoints-schema6-dim${{ matrix.dimension }}-${{ github.run_id }}

      # ---- Upload per-dimension artifacts (for the merge job) ----
      - name: Upload per-dim results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dim-${{ matrix.dimension }}-results
          path: results/
          retention-days: 30
          if-no-files-found: warn

  merge:
    name: Merge all dimensions and generate figures
    needs: [benchmark]
    if: always()
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # ---- Download every per-dimension artifact ----
      - name: Download all per-dimension results
        uses: actions/download-artifact@v4
        with:
          pattern: dim-*-results
          merge-multiple: true
          path: results/

      # ---- Combine checkpoints into one aggregate ----
      - name: Rebuild benchmark_results.json
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d = Path('results/checkpoints')
          records = []
          for p in sorted(d.glob('*.json')):
              try:
                  with open(p) as f:
                      records.append(json.load(f))
              except Exception as e:
                  print(f"skip {p}: {e}")
          out = Path('results/benchmark_results.json')
          with open(out, 'w') as f:
              json.dump(records, f, indent=2)
          print(f"Wrote {len(records)} records to {out}")
          PY

      # ---- Generate figures and tables from merged data ----
      - name: Generate figures
        run: python generate_figures.py

      - name: Generate LaTeX tables
        run: python generate_latex_tables.py

      # ---- Save the COMBINED checkpoints so future runs can resume ----
      - name: Save combined checkpoint cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: results/checkpoints
          key: lwe-checkpoints-schema6-common-${{ github.run_id }}

      # ---- Upload final merged artifact ----
      - name: Upload merged results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results-merged
          path: results/
          retention-days: 90