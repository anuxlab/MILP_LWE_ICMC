name: LWE Benchmark

on:
  push:
    branches: [main]
    paths:
      - 'lwe_benchmark.py'
      - 'generate_figures.py'
      - 'plot_benchmark_diagnostics.py'
      - 'instrument_root_diagnostics.py'
      - 'generate_latex_tables.py'
      - 'requirements.txt'
      - '.github/workflows/benchmark.yml'
  workflow_dispatch:
    inputs:
      instances:
        description: 'Instances per config'
        default: '10'
      time_limit:
        description: 'Base time limit per attack (seconds)'
        default: '60'
      bkz_beta:
        description: 'BKZ block size'
        default: '15'
      force_rerun:
        description: 'Force rerun (ignore checkpoints)'
        type: boolean
        default: false
      capture_logs:
        description: 'Capture full solver logs (increases artifact size)'
        type: boolean
        default: false
      run_root_diagnostics:
        description: 'Run Extension 1 root diagnostics'
        type: boolean
        default: true

jobs:
  # ============================================================
  # JOB 1: ENVIRONMENT SANITY CHECK
  # ============================================================
  quick-test:
    name: Environment sanity check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify solvers
        run: |
          python -c "import highspy; print('highspy OK')"
          python -c "from pulp import HiGHS; print('pulp.HiGHS OK')"
          python -c "from pulp import PULP_CBC_CMD; print('pulp CBC OK')"
          python -c "from fpylll import LLL, BKZ; print('fpylll OK')"

      - name: Run quick sanity test
        run: python quick_test.py

  # ============================================================
  # JOB 2: PARALLEL DIMENSION BENCHMARK
  # ============================================================
  benchmark:
    name: Benchmark n=${{ matrix.dimension }}
    needs: quick-test
    runs-on: ubuntu-latest
    timeout-minutes: 200
    continue-on-error: true

    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        dimension: [5, 10, 15, 20, 25, 30, 40, 50]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Restore shared checkpoint cache
        uses: actions/cache/restore@v4
        with:
          path: results/checkpoints
          key: lwe-checkpoints-schema7-common-${{ github.run_id }}
          restore-keys: |
            lwe-checkpoints-schema7-common-
            lwe-checkpoints-schema6-common-

      - name: Restore instance artifacts cache
        uses: actions/cache/restore@v4
        with:
          path: results/instances
          key: lwe-instances-schema1-${{ github.run_id }}
          restore-keys: |
            lwe-instances-schema1-

      - name: Run benchmark for n=${{ matrix.dimension }}
        run: |
          mkdir -p results
          python lwe_benchmark.py \
            --dimensions ${{ matrix.dimension }} \
            --instances ${{ github.event.inputs.instances || '10' }} \
            --time-limit ${{ github.event.inputs.time_limit || '60' }} \
            --bkz-beta ${{ github.event.inputs.bkz_beta || '15' }} \
            ${{ github.event.inputs.force_rerun == 'true' && '--force-rerun' || '' }} \
            ${{ github.event.inputs.capture_logs == 'true' && '--capture-logs' || '' }} \
            2>&1 | tee results/run_dim${{ matrix.dimension }}.log

      - name: Save checkpoint cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: results/checkpoints
          key: lwe-checkpoints-schema7-dim${{ matrix.dimension }}-${{ github.run_id }}

      - name: Save instance artifacts cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: results/instances
          key: lwe-instances-schema1-n${{ matrix.dimension }}-${{ github.run_id }}

      - name: Upload per-dimension results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dim-${{ matrix.dimension }}-results
          path: results/
          retention-days: 30
          if-no-files-found: warn

  # ============================================================
  # JOB 3: MERGE, DIAGNOSTICS, FIGURES, TABLES
  # ============================================================
  merge:
    name: Merge, diagnostics, and figures
    needs: [benchmark]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Download all per-dimension results
        uses: actions/download-artifact@v4
        with:
          pattern: dim-*-results
          merge-multiple: true
          path: results/

      - name: Rebuild benchmark_results.json
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d = Path('results/checkpoints')
          records = []
          for p in sorted(d.glob('*.json')):
              try:
                  with open(p) as f:
                      records.append(json.load(f))
              except Exception as e:
                  print(f"skip {p}: {e}")
          out = Path('results/benchmark_results.json')
          with open(out, 'w') as f:
              json.dump(records, f, indent=2)
          print(f"Wrote {len(records)} records to {out}")
          PY

      - name: Record environment manifest
        run: |
          {
            echo "# Environment Manifest"
            echo ""
            echo "Timestamp: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "Git commit: $(git rev-parse HEAD)"
            echo "Runner: ${{ runner.os }} ${{ runner.arch }}"
            echo "Image: ${{ runner.name }}"
            echo ""
            echo "## Python"
            python --version
            echo ""
            echo "## Frozen dependencies"
            echo '```'
            pip freeze
            echo '```'
          } > results/ENVIRONMENT.md

      - name: Instrument root diagnostics (Extension 1)
        if: ${{ github.event.inputs.run_root_diagnostics != 'false' }}
        continue-on-error: true
        run: |
          echo "Running Extension 1 instrumentation..."
          python instrument_root_diagnostics.py || \
            echo "[WARN] Extension 1 diagnostics failed; continuing"

      - name: Generate main figures
        run: python generate_figures.py

      - name: Generate MILP diagnostics figure
        continue-on-error: true
        run: python plot_benchmark_diagnostics.py

      - name: Generate LaTeX tables
        run: python generate_latex_tables.py

      - name: Save combined checkpoint cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: results/checkpoints
          key: lwe-checkpoints-schema7-common-${{ github.run_id }}

      - name: Save combined instance artifacts cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: results/instances
          key: lwe-instances-schema1-${{ github.run_id }}

      - name: Upload merged results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results-merged
          path: results/
          retention-days: 90