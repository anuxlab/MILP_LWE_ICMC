name: LWE Benchmark

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dimensions:
        description: 'Dimensions (space-separated)'
        default: '5 10 15 20'
      instances:
        description: 'Instances per config'
        default: '10'
      time_limit:
        description: 'Time limit per attack (seconds)'
        default: '60'
      bkz_beta:
        description: 'BKZ block size'
        default: '15'

jobs:
  quick-test:
    name: Environment sanity check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install HiGHS binary (from GitHub releases)
        run: |
          HIGHS_VER=1.7.2
          cd /tmp
          wget -q "https://github.com/ERGO-Code/HiGHS/releases/download/v${HIGHS_VER}/highs-${HIGHS_VER}-linux-x64.tar.gz" -O highs.tar.gz \
            || wget -q "https://github.com/ERGO-Code/HiGHS/releases/download/v${HIGHS_VER}/HiGHS-${HIGHS_VER}-linux-x64.tar.gz" -O highs.tar.gz
          tar -xzf highs.tar.gz
          BIN=$(find /tmp -name highs -type f -executable | head -1)
          echo "Found HiGHS binary at: $BIN"
          sudo cp "$BIN" /usr/local/bin/highs
          sudo chmod +x /usr/local/bin/highs
          highs --version

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run quick sanity test
        run: python quick_test.py

  benchmark:
    name: Run full benchmark (HiGHS + CBC)
    needs: quick-test
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install HiGHS binary (from GitHub releases)
        run: |
          HIGHS_VER=1.7.2
          cd /tmp
          wget -q "https://github.com/ERGO-Code/HiGHS/releases/download/v${HIGHS_VER}/highs-${HIGHS_VER}-linux-x64.tar.gz" -O highs.tar.gz \
            || wget -q "https://github.com/ERGO-Code/HiGHS/releases/download/v${HIGHS_VER}/HiGHS-${HIGHS_VER}-linux-x64.tar.gz" -O highs.tar.gz
          tar -xzf highs.tar.gz
          BIN=$(find /tmp -name highs -type f -executable | head -1)
          echo "Found HiGHS binary at: $BIN"
          sudo cp "$BIN" /usr/local/bin/highs
          sudo chmod +x /usr/local/bin/highs
          highs --version

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run dual-solver benchmark
        run: |
          python lwe_benchmark.py \
            --dimensions ${{ github.event.inputs.dimensions || '5 10 15 20' }} \
            --instances ${{ github.event.inputs.instances || '10' }} \
            --time-limit ${{ github.event.inputs.time_limit || '60' }} \
            --bkz-beta ${{ github.event.inputs.bkz_beta || '15' }}

      - name: Generate figures
        run: python generate_figures.py

      - name: Generate LaTeX tables
        run: python generate_latex_tables.py

      - name: Upload results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: benchmark-results
          path: results/
          retention-days: 30