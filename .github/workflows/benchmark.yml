name: LWE Benchmark

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      instances:
        description: 'Instances per config'
        default: '10'
      time_limit:
        description: 'Base time limit per attack (seconds)'
        default: '60'
      bkz_beta:
        description: 'BKZ block size'
        default: '15'
      force_rerun:
        description: 'Force rerun (ignore checkpoints)'
        type: boolean
        default: false

jobs:
  # ============================================================
  # JOB 1: QUICK ENVIRONMENT SANITY CHECK
  # ============================================================
  quick-test:
    name: Environment sanity check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify solvers
        run: |
          python -c "import highspy; print('highspy OK')"
          python -c "from pulp import HiGHS; print('pulp.HiGHS OK')"
          python -c "from pulp import PULP_CBC_CMD; print('pulp CBC OK')"
          python -c "from fpylll import LLL, BKZ; print('fpylll OK')"

      - name: Run quick sanity test
        run: python quick_test.py

  # ============================================================
  # JOB 2: PARALLEL BENCHMARK (one job per dimension)
  # ============================================================
  benchmark:
    name: Benchmark n=${{ matrix.dimension }}
    needs: quick-test
    runs-on: ubuntu-latest
    timeout-minutes: 200
    continue-on-error: true

    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        dimension: [5, 10, 15, 20, 25, 30, 40, 50]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Restore shared checkpoint cache
        uses: actions/cache/restore@v4
        with:
          path: results/checkpoints
          key: lwe-checkpoints-schema6-common-${{ github.run_id }}
          restore-keys: |
            lwe-checkpoints-schema6-common-
            lwe-checkpoints-schema5-main-

      - name: Run benchmark for n=${{ matrix.dimension }}
        run: |
          mkdir -p results
          python lwe_benchmark.py \
            --dimensions ${{ matrix.dimension }} \
            --instances ${{ github.event.inputs.instances || '10' }} \
            --time-limit ${{ github.event.inputs.time_limit || '60' }} \
            --bkz-beta ${{ github.event.inputs.bkz_beta || '15' }} \
            ${{ github.event.inputs.force_rerun == 'true' && '--force-rerun' || '' }} \
            2>&1 | tee results/run_dim${{ matrix.dimension }}.log

      - name: Save per-dimension checkpoints
        if: always()
        uses: actions/cache/save@v4
        with:
          path: results/checkpoints
          key: lwe-checkpoints-schema6-dim${{ matrix.dimension }}-${{ github.run_id }}

      - name: Upload per-dimension results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dim-${{ matrix.dimension }}-results
          path: results/
          retention-days: 30
          if-no-files-found: warn

  # ============================================================
  # JOB 3: MERGE ALL DIMENSIONS AND GENERATE FIGURES
  # ============================================================
  merge:
    name: Merge all dimensions and generate figures
    needs: [benchmark]
    if: always()
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Download all per-dimension results
        uses: actions/download-artifact@v4
        with:
          pattern: dim-*-results
          merge-multiple: true
          path: results/

      - name: Rebuild benchmark_results.json
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d = Path('results/checkpoints')
          records = []
          for p in sorted(d.glob('*.json')):
              try:
                  with open(p) as f:
                      records.append(json.load(f))
              except Exception as e:
                  print(f"skip {p}: {e}")
          out = Path('results/benchmark_results.json')
          with open(out, 'w') as f:
              json.dump(records, f, indent=2)
          print(f"Wrote {len(records)} records to {out}")
          PY

      - name: Generate figures
        run: python generate_figures.py

      - name: Generate LaTeX tables
        run: python generate_latex_tables.py

      - name: Save combined checkpoint cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: results/checkpoints
          key: lwe-checkpoints-schema6-common-${{ github.run_id }}

      - name: Upload merged results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results-merged
          path: results/
          retention-days: 90